name: 大意の誤り
description: 大意の誤りや、よりよい大意を知らせる
title: "[訳] 蔵原伸二郎 詩篇（『近代浪漫派文庫 29 大木惇夫 蔵原伸二郎』より） "
labels: ["訳"]
body:
  - type: input
    id: block
    attributes:
      label: 段落ID
      description: "行頭にある ID（例: kurahara-shinjiro-romanha29-000001）"
    validations:
      required: true
  - type: textarea
    id: before
    attributes:
      label: いまの大意
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: 直した大意
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 理由・根拠
